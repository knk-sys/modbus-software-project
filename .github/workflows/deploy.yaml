name: Deploy Modbus App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          # Create .ssh directory
          mkdir -p ~/.ssh
          
          # Save SSH private key to file and set proper permissions
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Add EC2 to known hosts to avoid SSH fingerprint prompt
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Install python3-venv and dependencies
        run: |
          # Install python3-venv and dependencies on EC2
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} <<EOF
          sudo apt update
          sudo apt install -y python3-venv python3-pip

          # Ensure the project directory exists
          if [ ! -d "modbus-software-project" ]; then
            git clone https://github.com/knk-sys/modbus-software-project.git
          fi

          # Navigate to the project directory
          cd modbus-software-project

          # Pull the latest code
          git pull origin main

          # Create a Python virtual environment if it doesn't exist
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi

          # Activate the virtual environment
          source venv/bin/activate

          # Install dependencies inside the virtual environment
          pip install -r requirements.txt

          # Kill any running instance of app.py
          pkill -f app.py || true

          # Run the application in the background
          nohup python3 app.py &
          EOF

      - name: Confirm Deployment
        run: |
          # SSH into EC2 and check if the app is running
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} <<EOF
          ps aux | grep python3
          EOF
